    caution: "New Jersey's law states its purpose as access for 'the citizens of this State'. If you live elsewhere, consider asking a New Jersey resident to file, or use the federal FOIA route for federal grant records."
    quote: "government records shall be readily accessible for inspection, copying, or examination by the citizens of this State"
    quote_url: *NJ
  response:
    days: 7
