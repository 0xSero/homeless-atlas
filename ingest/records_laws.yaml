LA:
  name: Louisiana
  law_name: {value: Louisiana Public Records Law}
  citation: La. R.S. 44:1 et seq.
  statute_url: &LA "https://legis.la.gov/Legis/Law.aspx?d=99688"
  publisher: Louisiana State Legislature
  basis: statute
  custodian_term:
    value: custodian
    quote: "The custodian shall present any public record to any person of the age of majority who so requests."
    quote_url: "https://legis.la.gov/Legis/Law.aspx?d=99691"
  who_may_request:
    value: other
    explain: "Any person of the age of majority (18 or older); no residency requirement."
    quote: "any person of the age of majority may inspect, copy, or reproduce any public record."
    quote_url: *LA
  response:
    days: 5
    day_type: business
    clock_starts: the date of the in-person, written or electronic request
    note: "Without a written determination or time estimate within 5 business days the requester may go to court; records in active use must be made available within 3 business days."
    quote: "by the passage of five days, exclusive of Saturdays, Sundays, and legal public holidays, from the date of his in-person, written, or electronic request without receiving a determination in writing by the custodian"
    quote_url: &LA35 "https://legis.la.gov/Legis/Law.aspx?d=99703"
  written_required: null
  must_cite_statute: null
  form_required: null
  fees:
