NH:
  name: New Hampshire
  law_name: {value: Right-to-Know Law}
  citation: RSA 91-A
  statute_url: &NH "https://gc.nh.gov/rsa/html/VI/91-A/91-A-4.htm"
  publisher: New Hampshire General Court
  basis: statute
  custodian_term: null
  who_may_request:
