    quote_url: "https://legis.la.gov/Legis/Law.aspx?d=99691"
  fee_waiver: null
  deemed_denial:
    summary: "Five business days without a written determination or estimate counts as a denial for going to court."
    quote: "either by a determination of the custodian or by the passage of five days, exclusive of Saturdays, Sundays, and legal public holidays"
    quote_url: *LA35
  appeal:
