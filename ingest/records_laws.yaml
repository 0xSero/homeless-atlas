    days: 3
    day_type: business
    clock_starts: the date the custodian receives the request
    note: "May exceed 3 days for reasonable cause, with a detailed explanation and the earliest date the records will be available."
    quote: "shall be acted upon as soon as possible, but in no event later than the end of the third business day following the date the request is received by the custodian of records"
    quote_url: *MO
  written_required: null
  must_cite_statute: null
  form_required: null
  fees: null
  fee_waiver: null
  deemed_denial: null
  appeal: null

