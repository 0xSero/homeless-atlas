    quote_url: *LA35

MS:
  name: Mississippi
  law_name: {value: Mississippi Public Records Act of 1983, short: Mississippi Public Records Act}
  citation: Miss. Code Ann. 25-61-1 et seq.
  statute_url: &MS "https://www.ethics.ms.gov/title-25-chapter-61-public-access-public-records"
  publisher: Mississippi Ethics Commission (reprinting Title 25, Chapter 61)
  basis: official_guide
  basis_note: "Mississippi's official code is published through a commercial publisher's site; the Ethics Commission, which enforces the Act, reprints it."
  custodian_term: null
  who_may_request:
    value: any_person
    quote: "any person shall have the right to inspect, copy or mechanically reproduce or obtain a reproduction of any public record of a public body"
    quote_url: *MS
  response:
    days: 7
    day_type: business
    clock_starts: receipt of the request
    note: "If not produced by the seventh working day, the body must explain in writing; production may not be later than 14 working days."
    quote: "No public body shall adopt procedures which will authorize the public body to produce or deny production of a public record later than seven (7) working days from the date of the receipt of the request"
    quote_url: *MS
    extension:
      days: 14
      day_type: business
      conditions: "written explanation by the seventh working day; 14 working days from the original request is the outer limit"
      quote: "in no event shall the date for the public body's production of the requested records be any later than fourteen (14) working days from the receipt by the public body of the original request."
      quote_url: *MS
  written_required: null
  must_cite_statute: null
  form_required: null
  fees:
    summary: "Fees may not exceed the actual cost of searching, reviewing, duplicating and mailing."
    quote: "in no case to exceed, the actual cost of searching, reviewing and/or duplicating and, if applicable, mailing copies of public records."
    quote_url: *MS
  fee_waiver: null
  deemed_denial: null
  appeal:
    body: Mississippi Ethics Commission (complaint), or chancery court
    deadline_days: null
    day_type: null
    url: null
    quote: "The Mississippi Ethics Commission shall have the authority to enforce the provisions of this chapter upon a complaint filed by any person denied the right"
    quote_url: *MS

MO:
