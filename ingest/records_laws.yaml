    quote_url: *NJ

NM:
  name: New Mexico
  law_name: {value: Inspection of Public Records Act}
  citation: NMSA 1978, 14-2-1 et seq.
  statute_url: &NM "https://nmdoj.gov/wp-content/uploads/NMDOJ-IPRA-Guide-Ninth-Edition-25.03.21.pdf"
  publisher: New Mexico Department of Justice (IPRA Compliance Guide, 9th edition, reprinting the Act)
  basis: official_guide
  basis_note: "The official compilation (NMOneSource) is a JavaScript application; the Attorney General's IPRA guide reprints the Act."
  custodian_term: null
  who_may_request:
    value: any_person
    quote: "Every person has a right to inspect public records of this state except"
    quote_url: *NM
  response:
    days: 15
    day_type: calendar
    clock_starts: receipt of a written request
    note: "If inspection is not allowed within 3 business days, the custodian must explain in writing when records will be available."
    quote: "a written request for inspection of public records that has not been permitted within fifteen days of receipt by the office of the custodian may be deemed denied."
    quote_url: *NM
  written_required: null
  must_cite_statute: null
  form_required: null
  fees: null
  fee_waiver: null
  deemed_denial:
    summary: "A written request not granted within 15 days may be deemed denied."
    quote: "a written request for inspection of public records that has not been permitted within fifteen days of receipt by the office of the custodian may be deemed denied."
    quote_url: *NM
  appeal: null

NY:
  name: New York
  law_name: {value: Freedom of Information Law}
  citation: N.Y. Public Officers Law 84 to 90
  statute_url: &NY "https://www.nysenate.gov/legislation/laws/PBO/89"
  publisher: New York State Senate (official laws of New York)
  basis: statute
  custodian_term: null
  who_may_request:
    value: any_person
    explain: "The law requires agencies to make all records available for public inspection and copying, with listed exceptions."
    quote: "make available for public inspection and copying all records, except those records or portions thereof that may be withheld"
    quote_url: "https://www.nysenate.gov/legislation/laws/PBO/87"
  response:
    days: 5
    day_type: business
    clock_starts: receipt of a written request
    note: "Within 5 business days: the records, a written denial, or an acknowledgment with an approximate date; if granted, normally within 20 business days of the acknowledgment."
    quote: "within five business days of the receipt of a written request for a record reasonably described, shall make such record available to the person requesting it, deny such request in writing or furnish a written acknowledge"
    quote_url: *NY
    extension:
      days: 20
      day_type: business
      conditions: "from the acknowledgment; beyond that the agency must give reasons and a date certain"
      quote: "if circumstances prevent disclosure to the person requesting the record or records within twenty business days from the date of the acknowledgement of the receipt of the request"
      quote_url: *NY
  written_required: null
  must_cite_statute: null
  form_required: null
  fees: null
  fee_waiver: null
  deemed_denial:
    summary: "Failing to meet the response rules is a denial, which can be appealed."
    quote: "Failure by an agency to conform to the provisions of subdivision three of this section shall constitute a denial."
    quote_url: *NY
  appeal:
    body: head, chief executive or governing body of the agency
    deadline_days: 30
    day_type: calendar
    url: null
    quote: "any person denied access to a record may within thirty days appeal in writing such denial to the head, chief executive or governing body of the entity"
    quote_url: *NY

NC:
  name: North Carolina
  law_name: {value: North Carolina Public Records Law}
  citation: N.C.G.S. 132-1 et seq.
  statute_url: &NC "https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_132/GS_132-6.html"
  publisher: North Carolina General Assembly
  basis: statute
  custodian_term:
    value: custodian of public records
    quote: "Every custodian of public records shall permit any record in the custodian's custody to be inspected and examined"
    quote_url: *NC
  who_may_request:
    value: any_person
    quote: "inspected and examined at reasonable times and under reasonable supervision by any person"
    quote_url: *NC
  response:
    days: null
    day_type: other
    note: "No fixed number of days; copies must be furnished as promptly as possible."
    quote: "as promptly as possible, furnish copies thereof upon payment of any fees as may be prescribed by law."
    quote_url: *NC
  written_required: null
  must_cite_statute: null
  form_required: null
  fees: null
  fee_waiver: null
  deemed_denial: null
  appeal: null

ND:
  name: North Dakota
  law_name: {value: North Dakota Open Records Law}
  citation: N.D.C.C. 44-04-18
  statute_url: &ND "https://www.ndlegis.gov/cencode/t44c04.pdf"
  publisher: North Dakota Legislative Branch
  basis: statute
  custodian_term: null
  who_may_request:
    value: any_person
    explain: "Records are open to the public, and the entity may not ask who is requesting or why."
    quote: "may not ask for the motive or reason for requesting the records or for the identity of the person requesting public records."
    quote_url: *ND
  response:
    days: null
    day_type: other
    note: "No fixed number of days; an unreasonable delay violates the law."
    quote: "This section is violated when a person's right to review or receive a copy of a record that is not exempt or confidential is denied or unreasonably delayed"
    quote_url: *ND
  written_required:
    value: false
    quote: "An initial request need not be made in person or in writing, and the copy must be mailed upon request."
    quote_url: *ND
  must_cite_statute: null
  form_required: null
  fees:
    summary: "Up to 25 cents per paper copy page; actual cost for other copies; payment may be required first."
    quote: "A public entity may charge up to twenty-five cents per impression of a paper copy."
    quote_url: *ND
  fee_waiver: null
  deemed_denial: null
  appeal:
    body: North Dakota Attorney General (opinion review)
    deadline_days: 30
    day_type: calendar
    url: null
    quote: "A request made under this section must be made within thirty days of the alleged violation"
    quote_url: *ND

OH:
  name: Ohio
  law_name: {value: Ohio Public Records Act}
  citation: Ohio Rev. Code 149.43
  statute_url: &OH "https://codes.ohio.gov/ohio-revised-code/section-149.43"
  publisher: Ohio Legislative Service Commission
  basis: statute
  custodian_term:
    value: person responsible for public records
    quote: "a public office or person responsible for public records shall make copies of the requested public record available to the requester at cost"
    quote_url: *OH
  who_may_request:
    value: any_person
    quote: "Upon request by any person and subject to division (B)(8) of this section, all public records responsive to the request shall be promptly prepared"
    quote_url: *OH
  response:
    days: null
    day_type: other
    note: "No fixed number of days; records must be promptly prepared, and copies provided within a reasonable period of time."
    quote: "shall make copies of the requested public record available to the requester at cost and within a reasonable period of time."
    quote_url: *OH
  written_required: null
  must_cite_statute: null
  form_required: null
  fees:
    summary: "Copies at cost."
    quote: "shall make copies of the requested public record available to the requester at cost"
    quote_url: *OH
  fee_waiver: null
  deemed_denial: null
  appeal: null

OK:
  name: Oklahoma
  law_name: {value: Oklahoma Open Records Act}
  citation: 51 O.S. 24A.1 et seq.
  statute_url: &OK "https://www.oscn.net/applications/oscn/DeliverDocument.asp?CiteID=80292"
  publisher: Oklahoma State Courts Network (official statutes)
  basis: statute
  custodian_term: null
  who_may_request:
    value: any_person
    quote: "All records of public bodies and public officials shall be open to any person for inspection, copying, or mechanical reproduction during regular business hours"
    quote_url: *OK
  response:
    days: null
    day_type: other
    note: "No fixed number of days; access must be prompt and reasonable."
    quote: "A public body must provide prompt, reasonable access to its records"
    quote_url: *OK
  written_required: null
  must_cite_statute: null
  form_required: null
  fees:
    summary: "Copy fees limited to reasonable direct costs, and no more than 25 cents a page for standard paper; advance payment allowed over $75."
    quote: "a public body may charge a fee only for recovery of the reasonable, direct costs of record copying, or mechanical reproduction."
    quote_url: *OK
  fee_waiver: null
  deemed_denial: null
  appeal: null

OR:
  name: Oregon
  law_name: {value: Oregon Public Records Law}
  citation: ORS 192.311 to 192.478
  statute_url: &OR "https://www.oregonlegislature.gov/bills_laws/ors/ors192.html"
  publisher: Oregon State Legislature
  basis: statute
  custodian_term: null
  who_may_request:
    value: any_person
    quote: "Every person has a right to inspect any public record of a public body in this state"
    quote_url: *OR
  response:
    days: 5
    day_type: business
    clock_starts: receipt of a written request
    note: "Within 5 business days the body must acknowledge or complete the response; it must then complete or update within 10 more business days."
    quote: "shall within five business days after receiving the request acknowledge receipt of the request or complete the"
    quote_url: *OR
    extension:
      days: 10
      day_type: business
      conditions: "counted from the acknowledgment deadline"
      quote: "not later than 10 business days after the date by which a public body is required to acknowledge receipt of the request"
      quote_url: *OR
  written_required: null
  must_cite_statute: null
  form_required: null
  fees: null
  fee_waiver:
    standard: "the waiver or reduction is in the public interest because the record primarily benefits the general public"
    quote: "the waiver or reduction of fees is in the public interest because making the record available primarily benefits the general public."
    quote_url: *OR
  deemed_denial: null
  appeal:
    body: District attorney of the county (local bodies) or Attorney General (state agencies)
    deadline_days: null
    day_type: null
    url: null
    quote: "The district attorney of the county in which the public body is located"
    quote_url: *OR

RI:
  name: Rhode Island
  law_name: {value: Access to Public Records Act}
  citation: R.I. Gen. Laws 38-2-1 et seq.
  statute_url: &RI "http://webserver.rilegislature.gov/Statutes/TITLE38/38-2/38-2-3.htm"
  publisher: Rhode Island General Assembly
  basis: statute
  custodian_term:
    value: public records officer
    quote: "the identification of a designated public records officer or unit, how to make a public records request, and where a public record request should be made"
    quote_url: *RI
  who_may_request:
    value: any_person
    quote: "every person or entity shall have the right to inspect and/or copy those records"
    quote_url: *RI
  response:
    days: 10
    day_type: business
    clock_starts: receipt of the request
    quote: "A public body receiving a request shall permit the inspection or copying within ten (10) business days after receiving a request."
    quote_url: *RI
    extension:
      days: 20
      day_type: business
      conditions: "written, particularized explanation; voluminous or difficult requests"
      quote: "the public body may have up to an additional twenty (20) business days to comply with the request"
      quote_url: *RI
  written_required: null
  must_cite_statute: null
  form_required:
    value: false
    quote: "A written request for public records need not be made on a form established by a public body"
    quote_url: *RI
  fees:
    summary: "Search and retrieval up to $15 an hour, first hour free; 15 cents a page; fees waived if the body misses the deadline."
    quote: "Hourly costs for a search and retrieval shall not exceed fifteen dollars ($15.00) per hour and no costs shall be charged for the first hour"
    quote_url: "http://webserver.rilegislature.gov/Statutes/TITLE38/38-2/38-2-4.htm"
  fee_waiver:
    standard: "a court may reduce or waive search fees in the public interest"
    quote: "A court may reduce or waive the fees for costs charged for search or retrieval if it determines that the information requested is in the public interest"
    quote_url: "http://webserver.rilegislature.gov/Statutes/TITLE38/38-2/38-2-4.htm"
  deemed_denial:
    summary: "No compliance within 10 business days is a denial, and search and copy fees are then waived."
    quotes:
      - quote: "Failure to comply with a request to inspect or copy the public record within the ten (10) business day period shall be deemed to be a denial."
        quote_url: &RI7 "http://webserver.rilegislature.gov/Statutes/TITLE38/38-2/38-2-7.htm"
      - quote: "All copying and search and retrieval fees shall be waived if a public body fails to produce requested records in a timely manner"
        quote_url: *RI7
  appeal:
    body: chief administrative officer of the public body, then the Attorney General
    deadline_days: null
    day_type: null
    url: null
    note: "The chief administrative officer must decide within 10 business days."
    quote: "may petition the chief administrative officer of that public body for a review of the determinations made by his or her subordinate."
    quote_url: "http://webserver.rilegislature.gov/Statutes/TITLE38/38-2/38-2-8.htm"

SC:
  name: South Carolina
  law_name: {value: South Carolina Freedom of Information Act}
  citation: S.C. Code 30-4-10 et seq.
  statute_url: &SC "https://www.scstatehouse.gov/code/t30c004.php"
  publisher: South Carolina Legislature
  basis: statute
  custodian_term: null
  who_may_request:
    value: any_person
    explain: "Any person may request records; people serving a prison sentence are excluded. Only a citizen of South Carolina may sue to enforce."
    quote: "A person has a right to inspect, copy, or receive an electronic transmission of any public record of a public body"
    quote_url: *SC
  response:
    days: 10
    day_type: business
    clock_starts: receipt of a written request
    note: "10 business days for a determination (20 if the records are over 24 months old); then 30 calendar days to produce (35 for older records)."
    quote: "shall within ten days (excepting Saturdays, Sundays, and legal public holidays) of the receipt of the request, notify the person making the request of its determination"
    quote_url: *SC
  written_required:
    value: true
    note: "The deadline applies to written requests."
    quote: "Each public body, upon written request for records made under this chapter, shall within ten days"
    quote_url: *SC
  must_cite_statute: null
  form_required: null
  fees:
    summary: "Actual cost of search, retrieval and redaction; no charge for review; deposit up to 25 percent."
    quote: "Fees may not be charged for examination and review to determine if the documents are subject to disclosure."
    quote_url: *SC
  fee_waiver:
    standard: "waiver or reduction in the public interest when the information primarily benefits the general public"
    quote: "waiver or reduction of the fee is in the public interest because furnishing the information can be considered as primarily benefiting the general public."
    quote_url: *SC
  deemed_denial:
    effect: approved
    summary: "If the body sends no determination in time, the request is considered approved for records that are not exempt."
    quote: "the request must be considered approved as to nonexempt records or information."
    quote_url: *SC
  appeal:
    body: court (circuit court; a citizen of South Carolina may file)
    deadline_days: null
    day_type: null
    url: null
    note: "Within one year of the violation."
    quote: "A citizen of the State may apply to the circuit court for a declaratory judgment, injunctive relief, or both"
    quote_url: *SC

SD:
  name: South Dakota
  law_name: {value: South Dakota Public Records Law}
  citation: SDCL 1-27
  statute_url: &SD "https://sdlegislature.gov/api/Statutes/1-27-37.html"
  publisher: South Dakota Legislature
  basis: statute
  custodian_term:
    value: public record officer
    quote: "A written request may be made to the public record officer of the public entity involved."
    quote_url: *SD
  who_may_request:
    value: any_person
    quote: "all citizens of this state, and all other persons interested in the examination of the public records"
    quote_url: "https://sdlegislature.gov/api/Statutes/1-27-1.html"
  response:
    days: 10
    day_type: business
    clock_starts: receipt of a written request
    quote: "The public record officer shall promptly respond to the written request but in no event later than ten business days from receipt of the request."
    quote_url: *SD
  written_required: null
  must_cite_statute: null
  form_required: null
  fees: null
  fee_waiver: null
  deemed_denial:
    summary: "No response to a written request in 10 business days is a denial."
    quote: "If the public record officer fails to respond to a written request within ten business days"
    quote_url: *SD
  appeal:
    body: Office of Hearing Examiners (written notice of review), or circuit court
    deadline_days: 90
    day_type: calendar
    how: mail
    note: "Send the notice of review by registered or certified mail."
    url: null
    quote: "a requestor may within ninety days of the denial commence a civil action by summons or, in the alternative, file a written notice of review with the Office of Hearing Examiners."
    quote_url: "https://sdlegislature.gov/api/Statutes/1-27-38.html"

TN:
  name: Tennessee
  law_name: {value: Tennessee Public Records Act}
  citation: Tenn. Code Ann. 10-7-503
  statute_url: &TN "https://comptroller.tn.gov/office-functions/open-records-counsel/open-meetings/frequently-asked-questions/tennessee-public-records-act-faqs.html"
  publisher: Tennessee Comptroller of the Treasury, Office of Open Records Counsel
  basis: official_guide
  basis_note: "Tennessee's code is published through a commercial publisher's site; the Comptroller's Office of Open Records Counsel explains the Act and cites 10-7-503."
  custodian_term:
    value: Public Record Request Coordinator
    quote: "the name and title of the entity's Public Record Request Coordinator (PRRC)"
    quote_url: *TN
  who_may_request:
    value: state_residents_only
    explain: "Only Tennessee citizens have a right of access; entities may serve others but need not."
    caution: "Tennessee's law gives the right to Tennessee citizens only. If you live elsewhere, ask a Tennessee resident to file, or use the federal FOIA route for federal grant records. The agency may ask to see a photo ID with an address."
    quote: "Only citizens of Tennessee have the right to inspect and receive copies of public records under the Tennessee Public Records Act."
    quote_url: *TN
  response:
    days: 7
    day_type: business
    clock_starts: the request
    quote: "the records custodian is required to take one of the following actions within seven (7) business days"
    quote_url: *TN
  written_required: null
  must_cite_statute: null
  form_required: null
  fees: null
  fee_waiver: null
  deemed_denial: null
  appeal:
    body: court (circuit or chancery court petition)
    deadline_days: null
    day_type: null
    url: null
    quote: "may file a petition for access to the records in the appropriate circuit or chancery court"
    quote_url: *TN
  letter_requirements:
    items:
      - text: "I am a citizen of Tennessee."
        quote: "Only citizens of Tennessee have the right to inspect and receive copies of public records"
        quote_url: *TN

TX:
  name: Texas
  law_name: {value: Texas Public Information Act}
  citation: Tex. Gov't Code ch. 552
  statute_url: &TX "https://www.texasattorneygeneral.gov/sites/default/files/files/divisions/open-government/publicinfo_hb.pdf"
  publisher: Office of the Texas Attorney General (Public Information Act Handbook, quoting the Act)
  basis: official_guide
  basis_note: "The Legislature's statute site is a JavaScript application; the Attorney General's handbook quotes the Act's sections."
  custodian_term:
    value: officer for public information
    quote: "An officer for public information of a governmental body shall promptly produce public information for inspection, duplication, or both"
    quote_url: *TX
  who_may_request:
    value: any_person
    quote: "shall promptly produce public information for inspection, duplication, or both on application by any person to the officer."
    quote_url: *TX
  response:
    days: 10
    day_type: business
    clock_starts: the date the information is requested
    note: "Information must be produced promptly; if it cannot be produced within 10 business days, the officer must certify that in writing and set a date."
    quote: "If an officer for public information cannot produce public information for inspection or duplication within 10 business days after the date the information is requested"
    quote_url: *TX
  written_required:
    value: true
    note: "Written requests go to the officer for public information by mail, email, hand delivery, or another approved method."
    quote: "A person may make a written request for public information under this chapter only by delivering the request by one of the following methods to the applicable officer for public information"
    quote_url: *TX
  must_cite_statute: null
  form_required: null
  fees: null
  fee_waiver: null
  deemed_denial:
    effect: presumed_public
    summary: "If the body does not ask the Attorney General for a ruling within 10 business days, the information is presumed public."
    quote: "the information requested in writing is presumed to be subject to required public disclosure and must be released unless there is a compelling reason to withhold the information."
    quote_url: *TX
  appeal: null

UT:
  name: Utah
  law_name: {value: Government Records Access and Management Act, short: Utah GRAMA}
  citation: Utah Code 63G-2
  statute_url: &UT "https://le.utah.gov/xcode/Title63G/Chapter2/C63G-2-S204_2023050320230503.html"
  publisher: Utah State Legislature
  basis: statute
  custodian_term: null
  who_may_request:
    value: any_person
    quote: "a person has the right to inspect a public record free of charge, and the right to take a copy of a public record during normal working hours"
    quote_url: "https://le.utah.gov/xcode/Title63G/Chapter2/C63G-2-S201_2026050620260701.html"
  response:
    days: 10
    day_type: business
    clock_starts: receipt of a written request
    note: "5 business days if the requester shows an expedited response benefits the public."
    quote: "as soon as reasonably possible, but no later than 10 business days after receiving a written request"
    quote_url: *UT
  written_required:
    value: true
    note: "The request must give your name, mailing address, email (if willing), daytime phone, and a description of the record."
    quote: "A person making a request for a record shall submit to the governmental entity that retains the record a written request containing"
    quote_url: *UT
  must_cite_statute: null
  form_required: null
  fees: null
  fee_waiver: null
  deemed_denial: null
  appeal:
    body: chief administrative officer of the governmental entity
    deadline_days: 30
    day_type: calendar
    url: null
    quote: "to the chief administrative officer of the governmental entity by filing a notice of appeal with the chief administrative officer within 30 days after"
    quote_url: "https://le.utah.gov/xcode/Title63G/Chapter2/C63G-2-S401_2025050720250507.html"
  letter_requirements:
    items:
      - caution: "Utah requires a daytime telephone number in the request. Add yours under your address before sending."
        quote: "daytime telephone number"
        quote_url: *UT

VT:
  name: Vermont
  law_name: {value: Vermont Public Records Act}
  citation: 1 V.S.A. 315 to 320
  statute_url: &VT "https://legislature.vermont.gov/statutes/section/01/005/00318"
  publisher: Vermont General Assembly
  basis: statute
  custodian_term: null
  who_may_request:
    value: any_person
    quote: "Any person may inspect or copy any public record of a public agency"
    quote_url: "https://legislature.vermont.gov/statutes/section/01/005/00316"
  response:
    days: 3
    day_type: business
    clock_starts: receipt of the request
    quote: "\"promptly\" means immediately, with little or no delay, and, unless otherwise provided in this section, not more than three business days"
    quote_url: *VT
    extension:
      days: 10
      day_type: business
      conditions: "unusual circumstances, with written notice; 10 business days from receipt is the outer limit"
      quote: "No such notice shall specify a date that would result in an extension for more than ten business days from receipt of the request"
      quote_url: *VT
  written_required: null
  must_cite_statute: null
  form_required: null
  fees: null
  fee_waiver: null
  deemed_denial:
    summary: "Missing the time limit is a denial."
    quote: "A custodian or head of the agency who fails to comply with the applicable time limit provisions of this section shall be deemed to have denied the request"
    quote_url: *VT
  appeal:
    body: head of the agency
    deadline_days: null
    day_type: null
    url: null
    note: "The head of the agency must decide within 5 business days."
    quote: "Any denial of access by the custodian of a public record may be appealed to the head of the agency."
    quote_url: *VT

VA:
  name: Virginia
  law_name: {value: Virginia Freedom of Information Act}
  citation: Va. Code 2.2-3700 et seq.
  statute_url: &VA "https://law.lis.virginia.gov/vacode/title2.2/chapter37/section2.2-3704/"
  publisher: Virginia Division of Legislative Services
  basis: statute
  custodian_term: null
  who_may_request:
    value: state_residents_only
    explain: "Records are open to citizens of the Commonwealth and to media that circulate or broadcast in Virginia."
    caution: "Virginia's law gives the right to Virginia citizens and Virginia media only. If you live elsewhere, ask a Virginia resident to file, or use the federal FOIA route for federal grant records."
    quote: "all public records shall be open to citizens of the Commonwealth, representatives of newspapers and magazines with circulation in the Commonwealth"
    quote_url: *VA
  response:
    days: 5
    day_type: business
    clock_starts: receipt of the request
    quote: "shall promptly, but in all cases within five working days of receiving a request, provide the requested records to the requester or make one of the following responses in writing"
    quote_url: *VA
    extension:
      days: 7
      day_type: business
      conditions: "if the body says within 5 working days that a response is not practically possible"
      quote: "the public body shall have an additional seven work days"
      quote_url: *VA
  written_required: null
  must_cite_statute: null
  form_required: null
  fees:
    summary: "Reasonable charges up to actual cost; a cost estimate must be given on request."
    quote: "a public body may make reasonable charges not to exceed its actual cost incurred in accessing, duplicating, supplying, or searching for the requested records"
    quote_url: *VA
  fee_waiver: null
  deemed_denial:
    summary: "No response is a denial and a violation of the Act."
